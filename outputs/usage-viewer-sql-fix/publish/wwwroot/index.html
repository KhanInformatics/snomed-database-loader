<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primary Care SNOMED CT Usage Data Viewer</title>
    <base href="/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/blazor/29.2.10/styles/bootstrap5.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

</head>
<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">khanclinicalinformatics.net is loading...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <div class="alert alert-danger m-3" role="alert">
            <strong>Application Error:</strong> 
            <span id="blazor-error-message">An unhandled error has occurred.</span>
            <br/>
            <small>Check the browser console for more details.</small>
            <div class="mt-2">
                <a href="" class="btn btn-primary btn-sm">Reload</a>
                <a class="dismiss btn btn-secondary btn-sm">Dismiss</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js" type="text/javascript"></script>

</html>
